<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إنشاء حساب | عين الجامعة</title><link rel="stylesheet" href="styles.css"></head><body><main class="auth"><div class="auth-card"><div class="brand"><div class="brand-mark">ع</div><div>عين الجامعة<small>جامعة ديالى • إنشاء حساب إداري</small></div></div><h1>إنشاء حساب إداري</h1><p class="help">أنشئ الحساب أولًا، وبعد نجاح الإنشاء سجّل الدخول من صفحة الدخول باستخدام اسم المستخدم وكلمة المرور.</p><form id="registerForm"><div class="field"><label>الاسم الكامل</label><input id="fullName" required autocomplete="name"></div><div class="field"><label>اسم المستخدم</label><input id="username" required autocomplete="username" minlength="3"></div><div class="field"><label>البريد الإلكتروني</label><input id="email" type="email" required autocomplete="email"></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" required minlength="8" autocomplete="new-password"></div><div class="field"><label>نوع الحساب</label><select id="role" required><option value="staff">موظف مركز</option><option value="admin">إدارة عليا</option></select></div><div class="field" id="centerField"><label>المركز</label><select id="center"><option value="">اختر المركز</option></select></div><button class="primary" style="width:100%">إنشاء الحساب</button></form><p id="msg" class="help" style="margin-top:14px"></p><p style="margin-top:14px;text-align:center"><a href="login.html">لدي حساب بالفعل</a></p></div><footer class="site-footer auth-footer"><strong>عين الجامعة</strong><span>جامعة ديالى</span><small>© جميع الحقوق محفوظة</small></footer></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="supabase-client.js"></script><script>
const centers=['الأمن','الإسعافات الطبية','الصيانة','الخدمات','الشكوى']; const center=document.getElementById('center'); centers.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;center.appendChild(o)}); const role=document.getElementById('role'), centerField=document.getElementById('centerField'); role.addEventListener('change',()=>centerField.style.display=role.value==='staff'?'block':'none'); role.dispatchEvent(new Event('change'));
document.getElementById('registerForm').addEventListener('submit',async e=>{e.preventDefault();const msg=document.getElementById('msg'); msg.textContent='جارٍ إنشاء الحساب...'; const fullName=document.getElementById('fullName').value.trim(),username=document.getElementById('username').value.trim().toLowerCase(),email=document.getElementById('email').value.trim().toLowerCase(),password=document.getElementById('password').value,accountRole=role.value,centerValue=center.value;if(!fullName||!username||!email||password.length<8||(accountRole==='staff'&&!centerValue)){msg.textContent='أكمل البيانات المطلوبة.';return} const {data:existing,error:lookupErr}=await sb.rpc('lookup_login_email',{username_input:username}); if(!lookupErr&&existing){msg.textContent='اسم المستخدم مستخدم بالفعل.';return} const {data,error}=await sb.auth.signUp({email,password,options:{data:{full_name:fullName,username,role:accountRole,center_category:accountRole==='staff'?centerValue:null,admin_registration:true}}}); if(error){msg.textContent=/rate limit|email rate|confirmation/i.test(error.message||'')?'تعذر إنشاء الحساب بسبب إعدادات البريد في Supabase. تأكد من تعطيل تأكيد البريد الإلكتروني من إعدادات Authentication.':error.message;return} const uid=data.user?.id; if(!uid){msg.textContent='تعذر إنشاء المستخدم.';return} const {data:boot,error:bootErr}=await sb.rpc('bootstrap_admin_profile',{p_user_id:uid,p_email:email,p_username:username,p_full_name:fullName,p_role:accountRole,p_center:accountRole==='staff'?centerValue:null}); if(bootErr||!boot){await sb.auth.signOut();msg.textContent='تم إنشاء مستخدم الدخول ولكن تعذر تجهيز ملف الإدارة. شغّل ملف التحديث SQL ثم أعد المحاولة.';return} await sb.auth.signOut(); msg.innerHTML='تم إنشاء الحساب الإداري بنجاح. <a href="login.html">انتقل إلى تسجيل الدخول</a>'; e.target.reset(); role.dispatchEvent(new Event('change'));});
</script></body></html>
