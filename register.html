<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>عين الجامعة | إنشاء حساب</title><link rel="stylesheet" href="styles.css"></head><body><main class="auth"><div class="auth-card"><div class="brand"><div class="brand-mark">ع</div><div><div>عين الجامعة</div><small>جامعة ديالى • طلب اعتماد حساب جامعي</small></div></div><h1>إنشاء حساب</h1><p class="help">أضف بياناتك وصورتي الهوية. سيتم حفظ البيانات وإرسال طلب الاعتماد للإدارة العليا. البريد الإلكتروني هنا لحفظ بيانات الحساب فقط، ولا يتم إرسال رسالة تحقق من التطبيق.</p><form id="regForm"><div class="field"><label>الاسم الكامل</label><input id="fullName" required></div><div class="field"><label>رقم الجامعة / الهوية المؤسسية</label><input id="institutionId" required></div><div class="field"><label>رقم الهاتف الفعال</label><input id="phone" inputmode="tel" required></div><div class="field"><label>البريد الإلكتروني</label><input id="email" type="email" required></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" minlength="8" required></div><div class="field"><label>صورة الهوية الأولى</label><input id="id1" type="file" accept="image/*" capture="environment" required></div><div class="field"><label>صورة الهوية الثانية</label><input id="id2" type="file" accept="image/*" capture="environment" required></div><button class="primary" style="width:100%">إرسال طلب التسجيل</button></form><p id="regMsg" class="help" style="margin-top:14px"></p><button class="link-btn" style="margin-top:10px" onclick="location.href='login.html'">لدي حساب بالفعل</button></div><footer class="site-footer auth-footer"><strong>عين الجامعة</strong><span>جامعة ديالى</span><small>© جميع الحقوق محفوظة</small></footer></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="supabase-client.js"></script><script>async function upload(file,path){const {error}=await sb.storage.from('id-documents').upload(path,file,{upsert:false,contentType:file.type});if(error)throw error;return path}document.getElementById('regForm').addEventListener('submit',async e=>{e.preventDefault();const msg=document.getElementById('regMsg');msg.textContent='جارٍ إنشاء الحساب ورفع الهوية...';try{const {data:auth,error}=await sb.auth.signUp({email:email.value.trim(),password:password.value,options:{data:{full_name:fullName.value.trim()}}});if(error){if(/rate limit|email rate limit/i.test(error.message||'')){throw new Error('تعذر إنشاء الحساب حاليًا. تأكد من إعداد تسجيل الدخول في Supabase ثم أعد المحاولة.')}throw error;}const uid=auth.user.id;const p1=await upload(id1.files[0],uid+'/front-'+Date.now()+'.jpg');const p2=await upload(id2.files[0],uid+'/back-'+Date.now()+'.jpg');const {error:pe}=await sb.from('profiles').upsert({id:uid,full_name:fullName.value.trim(),institution_id:institutionId.value.trim(),phone:phone.value.trim(),id_front_path:p1,id_back_path:p2,email:email.value.trim(),role:'student',account_status:'pending'});if(pe)throw pe;await sb.auth.signOut();msg.textContent='تم إرسال الطلب. الحساب الآن بانتظار موافقة الإدارة العليا.';e.target.reset();}catch(err){msg.textContent=err.message||'حدث خطأ أثناء التسجيل';}});</script></body></html>
