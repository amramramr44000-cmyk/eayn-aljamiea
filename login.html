<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>عين الجامعة | دخول الطالب</title><link rel="stylesheet" href="styles.css"></head><body><main class="auth"><div class="auth-card"><div class="brand"><div class="brand-mark">ع</div><div><div>عين الجامعة</div><small>جامعة ديالى • تطبيق الطلاب والمنتسبين</small></div></div><h1>تسجيل الدخول</h1><p class="help">استخدم البريد الإلكتروني وكلمة المرور. الحساب يجب أن يكون معتمدًا من الإدارة العليا قبل الدخول.</p><form id="loginForm"><div class="field"><label>البريد الإلكتروني</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required></div><button class="primary" style="width:100%">دخول</button></form><p id="loginMsg" class="help" style="margin-top:14px"></p><button class="link-btn" style="margin-top:10px" onclick="location.href='register.html'">إنشاء حساب جديد</button></div><footer class="site-footer auth-footer"><strong>عين الجامعة</strong><span>جامعة ديالى</span><small>© جميع الحقوق محفوظة</small></footer></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="supabase-client.js"></script><script>document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const msg=document.getElementById('loginMsg');msg.textContent='جارٍ تسجيل الدخول...';const {error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error){msg.textContent=error.message;return}const {data}=await sb.from('profiles').select('account_status').eq('id',(await sb.auth.getUser()).data.user.id).single();if(data?.account_status!=='approved'){await sb.auth.signOut();msg.textContent=data?.account_status==='rejected'?'الحساب مرفوض. راجع سبب الرفض مع الإدارة.':'الحساب بانتظار موافقة الإدارة العليا.';return}location.href='index.html';});</script></body></html>
