<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>عين الجامعة | دخول الطالب</title><link rel="stylesheet" href="styles.css"></head><body><main class="auth"><div class="auth-card"><div class="brand"><div class="brand-mark"><span class="material-symbols-rounded">account_balance</span></div><div><div>عين الجامعة</div><small>جامعة ديالى • تطبيق الطلاب والمنتسبين</small></div></div><h1>تسجيل الدخول</h1><p class="help">استخدم بريدك الجامعي وكلمة المرور. لا يمكن الدخول قبل اعتماد الحساب من الإدارة العليا.</p><form id="loginForm"><div class="field"><label for="email">البريد الإلكتروني</label><input id="email" type="email" placeholder="name@example.com" autocomplete="email" required></div><div class="field"><label for="password">كلمة المرور</label><div class="password-wrap"><input id="password" type="password" autocomplete="current-password" required><button type="button" class="password-toggle" aria-label="إظهار كلمة المرور" onclick="togglePassword('password',this)"><span class="material-symbols-rounded">visibility</span></button></div></div><button class="primary" style="width:100%"><span class="material-symbols-rounded">login</span> دخول</button></form><p id="loginMsg" class="help" style="margin-top:14px"></p><button class="link-btn" style="margin-top:10px" onclick="location.href='register.html'"><span class="material-symbols-rounded">person_add</span> إنشاء حساب جديد</button></div><footer class="site-footer auth-footer"><strong>عين الجامعة</strong><span>جامعة ديالى</span><small>© جميع الحقوق محفوظة</small></footer></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="supabase-client.js"></script><script>function togglePassword(id,btn){const el=document.getElementById(id);const show=el.type==='password';el.type=show?'text':'password';btn.setAttribute('aria-label',show?'إخفاء كلمة المرور':'إظهار كلمة المرور');btn.querySelector('.material-symbols-rounded').textContent=show?'visibility_off':'visibility'}document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const msg=document.getElementById('loginMsg');msg.textContent='جارٍ تسجيل الدخول...';try{const {error}=await sb.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error){msg.textContent='بيانات الدخول غير صحيحة.';return}const {data:u}=await sb.auth.getUser();const {data,error:pe}=await sb.from('profiles').select('account_status,role').eq('id',u.user.id).single();if(pe||data?.account_status!=='approved'||data?.role!=='student'){await sb.auth.signOut();msg.textContent=data?.account_status==='rejected'?'الحساب مرفوض. راجع سبب الرفض مع الإدارة.':'الحساب بانتظار موافقة الإدارة العليا.';return}location.href='index.html'}catch(err){msg.textContent='تعذر إتمام تسجيل الدخول حاليًا.'}});</script></body></html>
