<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>عين الجامعة | الإدارة العليا</title><link rel="stylesheet" href="styles.css"></head><body><main class="auth"><div class="auth-card"><div class="brand"><div class="brand-mark">ع</div><div>عين الجامعة<small>جامعة ديالى • الإدارة العليا</small></div></div><h1>دخول الإدارة</h1><p class="help">هذا التطبيق مخصص للحسابات المعتمدة فقط. لا تستخدم service_role key داخل المتصفح.</p><form id="loginForm"><div class="field"><label>اسم المستخدم</label><input id="username" autocomplete="username" required></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" required></div><button class="primary" style="width:100%">دخول الإدارة</button></form><p id="loginMsg" class="help" style="margin-top:14px"></p><p style="margin-top:14px;text-align:center"><a href="register.html">إنشاء حساب إداري</a></p></div><footer class="site-footer auth-footer"><strong>عين الجامعة</strong><span>جامعة ديالى</span><small>© جميع الحقوق محفوظة</small></footer></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="supabase-client.js"></script><script>const usernameEl=document.getElementById('username');document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();loginMsg.textContent='جارٍ التحقق...';const username=usernameEl.value.trim().toLowerCase();const {data:emailData,error:lookupError}=await sb.rpc('lookup_login_email',{username_input:username});if(lookupError||!emailData){loginMsg.textContent='اسم المستخدم غير موجود أو غير متاح.';return}const {error}=await sb.auth.signInWithPassword({email:emailData,password:password.value});if(error){loginMsg.textContent='بيانات الدخول غير صحيحة.';return}const {data:u}=await sb.auth.getUser();const {data:p}=await sb.from('profiles').select('role,account_status').eq('id',u.user.id).single();if(!p||!['admin','staff'].includes(p.role)||p.account_status!=='approved'){await sb.auth.signOut();loginMsg.textContent='هذا الحساب غير مصرح له بالدخول إلى تطبيق الإدارة.';return}location.href='index.html';});</script></body></html>
